# Deploy to Cloud Run. Only `main` reaches this workflow.
#
# Ordering is the whole design: `verify` must pass before `deploy` runs (`needs: verify`), and
# migrations run as an EXPLICIT step before the new revision is created — never on application
# boot. Two containers starting at once and both migrating is a bad afternoon (docs/07).
#
# NOT YET RUN. The secrets below do not exist until the Phase 7 GCP setup is done, so this
# workflow fails at the auth step rather than deploying anything half-configured. That is the
# intended state: the file is reviewable before it has ever had credentials.
name: deploy

on:
  push:
    branches: [main]
  # Manual re-deploy of the current main — e.g. rolling forward after a fixed config problem.
  workflow_dispatch:

# Never let two deploys race. `cancel-in-progress: false` because cancelling a run mid-MIGRATION
# is how you get a half-migrated database (docs/09 §3.5); let it finish and queue the next.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Identical gate to ci.yml. Duplicated deliberately rather than shared: a deploy that trusts a
  # verification it did not run itself is a deploy that ships whatever the last green run was.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://localhost:5432/build
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-0000000000
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-build-placeholder
          GOOGLE_CLIENT_SECRET: ci-build-placeholder
          OPENROUTER_API_KEY: ci-build-placeholder

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Attach a GitHub Environment so a required reviewer can gate production from the repo
    # settings. Nothing here enforces that on its own — configure it once in Settings →
    # Environments, and this line is what makes the deploy respect it.
    environment: production
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation, NOT a downloaded service-account JSON key. A JSON key in
      # GitHub secrets is a long-lived credential that cannot be rotated easily (docs/07).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      # Puts `gcloud` on PATH for the image build below. `deploy-cloudrun` runs its own gcloud
      # internally and did not need this while the build was delegated to it.
      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── Build the image HERE rather than delegating to `source: .` ───────────────────────
      #
      # WHY THIS STEP EXISTS. `NEXT_PUBLIC_*` values are inlined by Next into the CLIENT bundle at
      # BUILD time, so they can only arrive as Docker build args — a Cloud Run env var reaches the
      # server and never the browser. `deploy-cloudrun@v2` has NO input for build args (checked
      # against its action.yml), and `source: .` hands the build to Cloud Build where nothing in
      # this workflow can inject one. The result was silent: the image built, the deploy succeeded,
      # and browser-side PostHog and Sentry were permanently inert in production — the failure mode
      # that looks exactly like "no analytics events" and "no client errors".
      #
      # Building explicitly and deploying by digest is the smallest change that fixes it: every
      # other deployment setting below is untouched, and `image:` is a documented input of the same
      # action. The registry is the SAME `cloud-run-source-deploy` repository that `--source`
      # deploys have been pushing to all along, so no new infrastructure is introduced.
      #
      # Ordered BEFORE migrations deliberately. A build failure now costs nothing; the previous
      # order would have already migrated the database. The invariant that matters — migrations
      # complete before a new revision exists — still holds, because pushing an image creates no
      # revision.
      - name: Build and push the image
        id: image
        env:
          # Both are PUBLIC ingestion keys, not credentials: a Sentry DSN and a PostHog project
          # key can only write events, never read them, and both are already visible in the client
          # bundle by design (lib/env.ts). They are held as GitHub secrets to keep the literal
          # values out of this file, which would otherwise trip the DSN arm of the AGENTS.md secret
          # scan — not because disclosure would be a compromise.
          #
          # Unset is a supported configuration: the Dockerfile defaults both to empty and each SDK
          # is a no-op without its key, so a missing secret degrades to "that half is off" rather
          # than failing the deploy.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          set -euo pipefail   # no -x: never trace-print the build args

          # The project is written literally rather than read from `steps.auth.outputs.project_id`,
          # and that is a robustness choice. That output is only populated when the Workload
          # Identity provider supplies a project; when it does not, it is EMPTY, and an empty
          # substitution here yields `asia-south1-docker.pkg.dev//cloud-run-source-deploy/...` —
          # a malformed reference whose push error names neither the cause nor the variable.
          # The project is a fixed property of this deployment, so a literal cannot drift.
          REGISTRY="asia-south1-docker.pkg.dev"
          IMAGE="${REGISTRY}/innovationmate/cloud-run-source-deploy/edgify:${GITHUB_SHA}"

          # The repository already exists — every previous `--source` deploy pushed to it — and
          # edgify-deployer holds roles/artifactregistry.writer, so no create step is needed here.
          # Deliberately NOT guarded with a `describe || create` fallback: creating a repository
          # needs artifactregistry.repositories.create, which that account does NOT hold, so the
          # fallback could only ever turn a clear "repository missing" error into a confusing
          # "permission denied on create" one.
          gcloud auth configure-docker "${REGISTRY}" --quiet

          docker build \
            --build-arg "NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}" \
            --tag "${IMAGE}" .
          docker push "${IMAGE}"

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      # Explicit migration step, before the new revision exists. A failure here stops the deploy
      # and leaves the current revision serving — which is the point (docs/09 §3.5).
      - name: Run migrations
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: edgify
          # Was `source: .`. The image is now built above so the NEXT_PUBLIC_* build args can be
          # supplied; everything else about this deploy is unchanged.
          image: ${{ steps.image.outputs.image }}
          region: asia-south1
          # Secrets come from Secret Manager, never --set-env-vars: plaintext in the service
          # config is visible to anyone with console read access (docs/07).
          secrets: |
            DATABASE_URL=edgify-db-url:latest
            OPENROUTER_API_KEY=edgify-openrouter:latest
            BETTER_AUTH_SECRET=edgify-auth-secret:latest
            GOOGLE_CLIENT_ID=edgify-google-client-id:latest
            GOOGLE_CLIENT_SECRET=edgify-google-client-secret:latest
          # --max-instances is a HARD BLOCKER in docs/09 §1.4, and the reasoning there is worth
          # repeating because it is counter-intuitive: the billing cap bounds total spend AFTER
          # the fact (budget notifications lag by hours), so max-instances is the only thing
          # bounding the RATE. A runaway with unlimited concurrency outspends a budget that
          # updates a few times an hour.
          #
          # --timeout 300 is COUPLED to GRAPH_BUILD_BUDGET_MS (docs/09 §1.6). The budget must stay
          # comfortably below this number; the gap is what pays for writing status="failed" and
          # returning a response. Change one and change the other.
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=5
            --concurrency=40
            --cpu=1
            --memory=1Gi
            --timeout=300
          env_vars: |
            NODE_ENV=production
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            GRAPH_BUILD_BUDGET_MS=200000
            # SERVER-side Sentry. Read at runtime by sentry.server.config.ts, so a plain env var
            # is enough — no rebuild needed. Not in Secret Manager: a DSN is a PUBLIC ingestion
            # key, not a credential (lib/env.ts, instrumentation-client.ts), and putting it there
            # would add a runtime dependency for a value that already ships in the client bundle.
            # Held as a GitHub secret only to keep the literal DSN out of this file, which would
            # otherwise trip the DSN arm of the AGENTS.md secret scan.
            #
            # Until this was set, log.error's Sentry.captureException was a silent no-op in
            # production: lib/env.ts types SENTRY_DSN as optionalUrl, so the app booted happily
            # with no error reporting at all — the failure mode that looks exactly like "no errors".
            #
            # The BROWSER half (NEXT_PUBLIC_SENTRY_DSN) is still not here, and must not be: Next
            # inlines NEXT_PUBLIC_* at build time, so a runtime env var cannot reach the client
            # bundle. Setting it here would look configured and do nothing. It is supplied as a
            # Docker build arg by the "Build and push the image" step above — the same reason that
            # step exists at all.
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            # Without this the internal dashboard 404s for EVERYONE in production, including the
            # operator — lib/admin.ts fails closed on an empty allowlist, by design. Not in Secret
            # Manager because it is not a credential; a GitHub secret keeps it out of the workflow
            # file and out of the service config's plaintext.
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
